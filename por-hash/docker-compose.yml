version: "3.8"

services:
  # 1. PROXY / COORDENADOR
  proxy:
    image: citusdata/citus:12.1
    container_name: citus_proxy
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 2. OS 3 SHARDS
  shard_0:
    image: citusdata/citus:12.1
    container_name: citus_shard_0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce

  shard_1:
    image: citusdata/citus:12.1
    container_name: citus_shard_1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce

  shard_2:
    image: citusdata/citus:12.1
    container_name: citus_shard_2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce

  # 3. SCRIPT DE INICIALIZAÇÃO AUTOMÁTICA (Init Job)
  init_shards:
    image: postgres:15-alpine
    container_name: citus_init_script
    depends_on:
      proxy:
        condition: service_healthy # Espera o proxy estar pronto
    entrypoint: >
      /bin/sh -c "
        echo 'Aguardando o Proxy aceitar conexões SQL...';
        PGPASSWORD=postgrespassword psql -h proxy -U postgres -d ecommerce -c \"
          SELECT citus_add_node('shard_0', 5432);
          SELECT citus_add_node('shard_1', 5432);
          SELECT citus_add_node('shard_2', 5432);

          CREATE TABLE IF NOT EXISTS orders (
            id SERIAL,
            user_id VARCHAR(100) NOT NULL,
            product_id VARCHAR(100) NOT NULL,
            amount DECIMAL(10,2) NOT NULL,
            PRIMARY KEY (id, user_id)
          );

          SELECT create_distributed_table('orders', 'user_id', 'hash');
        \"
        echo 'Shards e Tabela distribuída por HASH configurados com sucesso!';
      "
